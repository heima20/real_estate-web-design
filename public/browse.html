<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Properties — SAIMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-browse">

  <header class="site-header site-header--pages" id="site-header">
    <a href="index.html" class="site-brand">SAIMO</a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="story.html">Story</a>
      <a href="browse.html" class="is-active">Browse</a>
      <a href="login.html" class="nav-auth">Sign In</a>
    </nav>
  </header>

  <main class="browse-main">
    <div class="browse-hero">
      <h1 class="font-display browse-hero__title">Choose Location & Type</h1>
      <p class="browse-hero__sub">Each card shows a summary — click for full gallery, price, and details.</p>
    </div>

    <div class="filters" id="filters">
      <div class="filters__group">
        <label for="q">Search by location or name</label>
        <input type="search" id="q" class="filters__input" placeholder="e.g. Coast, Villa, Azure…" autocomplete="off">
      </div>
      <div class="filters__group">
        <label for="loc">Governorate</label>
        <select id="loc" class="filters__input">
          <option value="">All Governorates</option>
        </select>
      </div>
      <div class="filters__group">
        <span class="filters__label">Type</span>
        <div class="filters__chips">
          <button type="button" class="chip is-active" data-type="">All</button>
          <button type="button" class="chip" data-type="villa">Villa</button>
          <button type="button" class="chip" data-type="apartment">Apartment</button>
        </div>
      </div>
    </div>

    <p class="browse-count" id="browse-count"></p>
    <div class="cards-grid" id="cards-grid"></div>
  </main>

  <footer class="site-footer">
    <small>© SAIMO</small>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="nav-auth">Sign In</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="browse.js"></script>
</body>
</html>
